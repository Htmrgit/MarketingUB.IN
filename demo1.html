<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO Meta Tags -->
    <title>Demo 1 - Deepanshu Restaurant | Order Online</title>
    <meta name="description" content="Authentic taste at Demo 1 Restaurant. Browse our menu and order fresh food via WhatsApp.">
    <meta name="author" content="Manohar Ray">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; scroll-behavior: smooth; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .cat-btn.active {
            background-color: #ef4444;
            color: white;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }

        .cart-sidebar {
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateX(100%);
        }
        .cart-sidebar.open { transform: translateX(0); }

        .carousel-container { position: relative; width: 100%; height: 200px; border-radius: 1rem; overflow: hidden; margin-bottom: 1rem; background: #eee; }
        .carousel-track { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; }
        .carousel-track::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; cursor: pointer; }
        .carousel-img { width: 100%; height: 100%; object-fit: cover; }
        
        .dot { width: 6px; height: 6px; background: rgba(0,0,0,0.2); border-radius: 50%; transition: 0.3s; }
        .dot.active { background: #ef4444; width: 12px; border-radius: 4px; }
        
        .variant-pill.active { background-color: #fee2e2; border-color: #ef4444; color: #b91c1c; }

        #lightbox-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; align-items: center; justify-content: center; }
        .scroll-mt-fix { scroll-margin-top: 150px; }
        
        .type-veg { border: 1px solid #22c55e; padding: 2px; display: inline-flex; }
        .type-veg::after { content: ''; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; }
        .type-non { border: 1px solid #ef4444; padding: 2px; display: inline-flex; }
        .type-non::after { content: ''; width: 6px; height: 6px; background: #ef4444; border-radius: 50%; }
    </style>
</head>
<body>

    <!-- Nav -->
    <nav class="fixed top-0 w-full z-[60] bg-white shadow-sm border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 h-16 flex justify-between items-center">
            <a href="#" class="text-xl font-bold text-red-600 tracking-tighter uppercase italic">Demo<span class="text-gray-800">One</span></a>
            <div class="flex items-center gap-3">
                <button onclick="toggleCart()" class="relative p-2 text-gray-700">
                    <i class="fas fa-shopping-basket text-2xl"></i>
                    <span id="cart-count" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white hidden">0</span>
                </button>
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-gray-700 text-xl"><i class="fas fa-bars"></i></button>
            </div>
        </div>
    </nav>

    <!-- Mobile Nav -->
    <div id="mobile-menu" class="fixed inset-0 bg-white z-[100] hidden flex-col items-center justify-center gap-8 text-2xl font-bold p-10">
        <button onclick="toggleMobileMenu()" class="absolute top-6 right-6 text-gray-400 text-3xl">&times;</button>
        <a href="#home" onclick="toggleMobileMenu()">HOME</a>
        <a href="#menu" onclick="toggleMobileMenu()">MENU</a>
        <a href="#contact" onclick="toggleMobileMenu()">CONTACT</a>
    </div>

    <!-- Hero -->
    <section id="home" class="pt-24 pb-12 px-4 bg-white">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center gap-10">
            <div class="flex-1 space-y-6">
                <h1 class="text-5xl md:text-7xl font-bold text-gray-900 leading-tight">Tasty Food, <br><span class="text-red-600">Fast Delivery.</span></h1>
                <p class="text-gray-500 text-lg">Freshly made with secret spices and lots of love. Order now!</p>
                <a href="#menu" class="bg-red-600 text-white px-8 py-4 rounded-xl font-bold inline-block shadow-lg shadow-red-100 hover:bg-red-700 transition-all">Order Online</a>
            </div>
            <div class="flex-1">
                <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1000&q=80" alt="Pizza" class="rounded-[3rem] shadow-2xl">
            </div>
        </div>
    </section>

    <!-- Menu -->
    <section id="menu" class="py-16 bg-gray-50 scroll-mt-fix">
        <div class="max-w-6xl mx-auto px-4">
            <div class="flex flex-col md:flex-row justify-between items-center gap-6 mb-12">
                <h2 class="text-3xl font-bold">Our Menu</h2>
                <div class="w-full md:w-80 relative">
                    <input type="text" id="menu-search" onkeyup="filterMenu()" placeholder="Search dishes..." class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-red-500 outline-none">
                    <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-gray-300"></i>
                </div>
            </div>

            <div class="sticky top-16 z-40 bg-gray-50/95 backdrop-blur py-4 mb-8 overflow-hidden">
                <div id="category-nav" class="flex gap-2 overflow-x-auto no-scrollbar">
                    <div class="w-24 h-10 skeleton rounded-full"></div>
                </div>
            </div>

            <div id="loading" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
                <div class="h-80 skeleton rounded-3xl"></div>
            </div>

            <div id="no-results" class="hidden text-center py-20 text-gray-400 font-bold uppercase tracking-widest">No Items Found</div>

            <div id="menu-content" class="space-y-16"></div>
        </div>
    </section>

    <!-- Contact -->
    <section id="contact" class="py-16 bg-white scroll-mt-fix">
        <div class="max-w-4xl mx-auto px-4">
            <div class="bg-gray-50 p-8 md:p-12 rounded-[2rem] border border-gray-100 shadow-sm text-center">
                <h2 class="text-3xl font-bold mb-8">Get In Touch</h2>
                <form onsubmit="sendContactMessage(event)" class="grid gap-4 text-left">
                    <div class="grid md:grid-cols-2 gap-4">
                        <input type="text" id="contact-name" placeholder="Name" required class="p-4 rounded-xl border-gray-200 outline-none focus:ring-2 focus:ring-red-500">
                        <input type="text" id="contact-subject" placeholder="Subject" class="p-4 rounded-xl border-gray-200 outline-none focus:ring-2 focus:ring-red-500">
                    </div>
                    <textarea id="contact-message" placeholder="Message..." required rows="4" class="p-4 rounded-xl border-gray-200 outline-none focus:ring-2 focus:ring-red-500"></textarea>
                    <button type="submit" class="bg-red-600 text-white py-4 rounded-xl font-bold hover:bg-red-700 transition-all flex items-center justify-center gap-3">
                        <i class="fab fa-whatsapp"></i> Send via WhatsApp
                    </button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white pt-16 pb-8">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h2 class="text-2xl font-bold text-red-500 mb-6 uppercase">Demo One</h2>
            <div class="flex justify-center gap-8 mb-12">
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram text-xl"></i></a>
                <a href="https://wa.me/919355650312" class="text-gray-400 hover:text-white"><i class="fab fa-whatsapp text-xl"></i></a>
            </div>
            <p class="text-[10px] text-gray-500 tracking-widest uppercase">
                Designed & Developed by <a href="https://htmrgit.github.io/MANOHARRAYRESUME/" target="_blank" class="text-red-500 font-bold hover:underline">Manohar Ray</a>
            </p>
        </div>
    </footer>

    <!-- Cart Sidebar -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 z-[70] hidden backdrop-blur-sm"></div>
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[450px] z-[80] bg-white cart-sidebar shadow-2xl flex flex-col">
        <div class="p-6 border-b flex justify-between items-center bg-white flex-shrink-0">
            <div>
                <h3 class="text-xl font-bold text-gray-900">Your Basket</h3>
                <p id="cart-items-count" class="text-[10px] font-bold text-red-600 uppercase">0 items</p>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="clearCart()" class="text-[10px] font-bold text-red-500 uppercase px-2 py-1 border border-red-500 rounded hidden" id="clear-cart-btn">Clear</button>
                <button onclick="toggleCart()" class="text-gray-400 text-2xl">&times;</button>
            </div>
        </div>
        
        <div class="flex-grow overflow-y-auto p-6 space-y-6 no-scrollbar bg-gray-50">
            <div id="cart-items" class="space-y-4">
                <div class="text-center py-20 opacity-20"><i class="fas fa-shopping-basket text-5xl mb-4"></i><p>Basket Empty</p></div>
            </div>
            <div id="order-form-container" class="space-y-6 pt-6 border-t hidden">
                <div class="grid grid-cols-2 gap-2 p-1 bg-gray-200 rounded-xl shadow-inner">
                    <button onclick="setOrderType('Pickup')" id="btn-pickup" class="py-2 rounded-lg font-bold text-xs uppercase bg-red-600 text-white shadow">Pickup</button>
                    <button onclick="setOrderType('Delivery')" id="btn-delivery" class="py-2 rounded-lg font-bold text-xs uppercase text-gray-500">Delivery</button>
                </div>
                <div id="delivery-address-box" class="hidden space-y-3">
                    <input type="text" id="order-name" placeholder="YOUR NAME" class="w-full p-4 rounded-xl border border-gray-100 text-sm font-bold uppercase outline-none focus:ring-2 focus:ring-red-500 shadow-sm">
                    <input type="tel" id="order-phone" placeholder="PHONE NUMBER" class="w-full p-4 rounded-xl border border-gray-100 text-sm font-bold outline-none focus:ring-2 focus:ring-red-500 shadow-sm">
                    <textarea id="order-address" placeholder="ADDRESS..." class="w-full p-4 rounded-xl border border-gray-100 text-sm h-24 outline-none focus:ring-2 focus:ring-red-500 shadow-sm uppercase"></textarea>
                </div>
            </div>
        </div>

        <div class="p-6 bg-white border-t flex-shrink-0">
            <div class="flex justify-between items-center mb-6 px-1">
                <span class="text-gray-400 font-bold text-xs uppercase tracking-widest">Total Bill</span>
                <span id="cart-total" class="text-3xl font-bold text-gray-900">&#8377;0</span>
            </div>
            <button onclick="sendOrder()" class="w-full bg-red-600 text-white py-4 rounded-xl font-bold text-sm uppercase shadow-lg active:scale-95 transform">Confirm Order</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox-modal" onclick="this.style.display='none'">
        <button class="absolute top-6 right-6 text-white text-3xl">&times;</button>
        <img id="lightbox-img" src="" class="max-w-[95%] max-h-[85vh] rounded-lg shadow-2xl" onclick="event.stopPropagation()">
    </div>

    <!-- Mobile Button -->
    <div id="mobile-cart-btn" onclick="toggleCart()" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] bg-red-600 text-white p-4 rounded-2xl shadow-2xl flex justify-between items-center z-[50] hidden transition-all active:scale-95 border-b-4 border-red-800">
        <div class="flex items-center gap-3">
            <i class="fas fa-shopping-basket"></i>
            <span id="mobile-cart-text" class="font-bold text-[10px] uppercase">0 Items</span>
        </div>
        <span id="mobile-cart-total" class="font-bold text-lg bg-black/10 px-4 py-1 rounded-xl">&#8377;0</span>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzi_hYsE9SG4nRKCg5hjyrjP98jzrT3R5mAHYUPyOXU-iYzk0IaUCOb47C9DwcfD2kqAA/exec';
        const WHATSAPP_NUMBER = '919355650312';
        
        let menuData = [];
        let cart = [];
        let orderType = 'Pickup';
        let autoPlayIntervals = {};

        async function fetchMenu() {
            try {
                const res = await fetch(API_URL);
                menuData = await res.json();
                renderMenu();
            } catch (e) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500 text-center col-span-full font-bold uppercase py-10">Error Loading Menu</p>';
            }
        }

        function getVariants(item) {
            let v = {};
            try { v = typeof item.variants === 'object' ? item.variants : JSON.parse(item.variants); }
            catch(e) { v = {"Standard": "0"}; }
            return v;
        }

        function renderMenu() {
            const container = document.getElementById('menu-content');
            const nav = document.getElementById('category-nav');
            document.getElementById('loading').classList.add('hidden');

            const groups = menuData.reduce((acc, item) => {
                const cat = item.category || 'Specials';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(item);
                return acc;
            }, {});

            const cats = Object.keys(groups).sort();
            nav.innerHTML = cats.map((cat, i) => `
                <button onclick="scrollToCategory('${cat.replace(/\s+/g, '-').toLowerCase()}', this)" 
                        class="cat-btn whitespace-nowrap px-6 py-2 rounded-full text-[10px] font-bold uppercase transition-all border border-gray-100 ${i===0 ? 'active' : 'bg-white text-gray-400'}">
                    ${cat}
                </button>
            `).join('');

            container.innerHTML = cats.map(cat => {
                const catId = cat.replace(/\s+/g, '-').toLowerCase();
                return `
                    <section id="${catId}" class="scroll-mt-fix menu-group">
                        <h3 class="text-2xl font-bold uppercase text-gray-800 mb-8 flex items-center gap-3">
                            <span class="w-2 h-8 bg-red-600 rounded-full"></span> ${cat}
                        </h3>
                        <div class="grid gap-8 sm:grid-cols-2 lg:grid-cols-3">
                            ${groups[cat].map(item => createItemCard(item)).join('')}
                        </div>
                    </section>
                `;
            }).join('');

            menuData.forEach(item => {
                const cardId = item.itemid || item.name.replace(/[^a-z0-9]/gi, '');
                const images = item.image ? item.image.split(',') : [];
                if (images.length > 1) startAutoPlay(cardId);
            });
        }

        function createItemCard(item) {
            const variants = getVariants(item);
            const varKeys = Object.keys(variants);
            const cardId = item.itemid || item.name.replace(/[^a-z0-9]/gi, '');
            const defaultPrice = variants[varKeys[0]];
            const isNonVeg = (item.type || "").toLowerCase().includes('non') || (item.name || "").toLowerCase().includes('chicken');

            const images = item.image ? item.image.split(',') : [];
            let imageHtml = '';
            
            if (images.length > 0) {
                imageHtml = `
                    <div class="carousel-container shadow-sm border border-gray-100">
                        <div class="carousel-track no-scrollbar" id="track-${cardId}" onscroll="updateDots('${cardId}')">
                            ${images.map(img => `<div class="carousel-slide" onclick="openLightbox('${img.trim()}')"><img src="${img.trim()}" class="carousel-img"></div>`).join('')}
                        </div>
                        ${images.length > 1 ? `
                            <div class="carousel-dots" id="dots-${cardId}">${images.map((_, i) => `<div class="dot ${i===0 ? 'active' : ''}"></div>`).join('')}</div>
                        ` : ''}
                    </div>
                `;
            }

            let variantSelector = varKeys.length > 1 ? `
                <div class="mt-4 flex flex-wrap gap-2">
                    ${varKeys.map((k, i) => `<button onclick="selectVariant(this, '${k}', '${variants[k]}')" class="variant-pill text-[9px] border border-gray-100 px-3 py-2 rounded-xl font-bold uppercase transition-all ${i===0 ? 'active' : 'text-gray-400'}">${k} - &#8377;${variants[k]}</button>`).join('')}
                </div>
            ` : `<p class="mt-4 font-bold text-red-600 text-xl">&#8377;${defaultPrice}</p>`;

            return `
                <div class="bg-white p-6 rounded-[2rem] border border-gray-100 shadow-sm flex flex-col justify-between h-full" id="card-${cardId}" data-name="${item.name.toLowerCase()}" data-cat="${item.category.toLowerCase()}">
                    <div>
                        ${imageHtml}
                        <div class="flex justify-between items-start mb-2">
                            <div class="${isNonVeg ? 'type-non' : 'type-veg'}"></div>
                        </div>
                        <h4 class="text-lg font-bold text-gray-900 group-hover:text-red-600 transition-colors uppercase leading-tight mb-2">${item.name}</h4>
                        <p class="text-xs text-gray-400 font-medium leading-relaxed line-clamp-2">${item.desc || 'Prepared fresh with authentic spices.'}</p>
                        ${variantSelector}
                    </div>
                    <button onclick="addToCart('${item.name.replace(/'/g, "\\'")}', '${cardId}')" data-variant="${varKeys[0]}" data-price="${defaultPrice}"
                            class="add-btn mt-6 w-full bg-gray-100 text-gray-900 py-4 rounded-2xl font-bold text-[10px] uppercase tracking-widest hover:bg-red-600 hover:text-white transition-all transform active:scale-95 shadow-inner">
                        Add to Basket
                    </button>
                </div>
            `;
        }

        function startAutoPlay(cardId) {
            autoPlayIntervals[cardId] = setInterval(() => {
                const track = document.getElementById(`track-${cardId}`);
                if (!track) return;
                let next = track.scrollLeft + track.offsetWidth;
                if (next >= track.scrollWidth) track.scrollTo({ left: 0, behavior: 'smooth' });
                else track.scrollTo({ left: next, behavior: 'smooth' });
            }, 3500);
        }

        window.updateDots = function(cardId) {
            const track = document.getElementById(`track-${cardId}`);
            const dots = document.getElementById(`dots-${cardId}`);
            if (!track || !dots) return;
            const index = Math.round(track.scrollLeft / track.offsetWidth);
            Array.from(dots.children).forEach((dot, i) => dot.classList.toggle('active', i === index));
        };

        function openLightbox(src) { document.getElementById('lightbox-img').src = src; document.getElementById('lightbox-modal').style.display = 'flex'; }
        function selectVariant(btn, variant, price) {
            const card = btn.closest('[id^="card-"]');
            const addBtn = card.querySelector('.add-btn');
            card.querySelectorAll('.variant-pill').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            addBtn.dataset.variant = variant;
            addBtn.dataset.price = price;
        }

        function addToCart(name, id) {
            const card = document.getElementById(`card-${id}`);
            const btn = card.querySelector('.add-btn');
            const variant = btn.dataset.variant;
            const price = parseFloat(btn.dataset.price);
            const item = cart.find(i => i.name === name && i.variant === variant);
            if (item) item.qty++; else cart.push({ id, name, variant, price, qty: 1 });
            updateCartUI();
            const old = btn.innerHTML; btn.innerHTML = 'Added ?'; btn.classList.add('bg-green-600', 'text-white');
            setTimeout(() => { btn.innerHTML = old; btn.classList.remove('bg-green-600', 'text-white'); }, 800);
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const mobBtn = document.getElementById('mobile-cart-btn');
            const form = document.getElementById('order-form-container');
            const clear = document.getElementById('clear-cart-btn');

            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center py-20 opacity-20"><i class="fas fa-shopping-basket text-5xl mb-4"></i><p>Basket Empty</p></div>';
                totalEl.innerHTML = "&#8377;0"; document.getElementById('cart-count').classList.add('hidden');
                mobBtn.classList.add('hidden'); form.classList.add('hidden'); clear.classList.add('hidden'); return;
            }

            form.classList.remove('hidden'); clear.classList.remove('hidden');
            const totalQty = cart.reduce((a, b) => a + b.qty, 0);
            document.getElementById('cart-count').innerText = totalQty;
            document.getElementById('cart-count').classList.remove('hidden');
            mobBtn.classList.remove('hidden');
            document.getElementById('mobile-cart-text').innerText = `${totalQty} Items Added`;
            document.getElementById('cart-items-count').innerText = `${totalQty} Items in Basket`;

            let total = 0;
            container.innerHTML = cart.map((item, idx) => {
                total += item.price * item.qty;
                return `<div class="bg-white p-4 rounded-2xl border border-gray-100 flex justify-between items-center shadow-sm">
                        <div class="pr-4"><p class="font-bold text-gray-800 text-sm leading-tight">${item.name}</p><p class="text-[9px] text-red-600 font-bold mt-1 uppercase">${item.variant}</p><p class="text-sm font-bold mt-2 text-gray-900">&#8377;${item.price * item.qty}</p></div>
                        <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-100"><button onclick="changeQty(${idx}, -1)" class="w-7 h-7 bg-white rounded-lg flex items-center justify-center shadow-sm">-</button><span class="font-bold text-sm w-4 text-center">${item.qty}</span><button onclick="changeQty(${idx}, 1)" class="w-7 h-7 bg-white rounded-lg flex items-center justify-center shadow-sm">+</button></div>
                    </div>`;
            }).join('');
            totalEl.innerHTML = `&#8377;${total}`;
            document.getElementById('mobile-cart-total').innerHTML = `&#8377;${total}`;
        }

        function clearCart() { if(confirm("Empty Basket?")) { cart = []; updateCartUI(); } }
        function filterMenu() {
            const query = document.getElementById('menu-search').value.toLowerCase();
            const items = document.querySelectorAll('[id^="card-"]');
            const groups = document.querySelectorAll('.menu-group');
            let found = 0;
            items.forEach(item => {
                const match = item.getAttribute('data-name').includes(query) || item.getAttribute('data-cat').includes(query);
                item.classList.toggle('hidden', !match); if(match) found++;
            });
            groups.forEach(g => { g.classList.toggle('hidden', g.querySelectorAll('[id^="card-"]:not(.hidden)').length === 0); });
            document.getElementById('no-results').classList.toggle('hidden', found > 0);
        }

        function scrollToCategory(id, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            const nav = document.getElementById('category-nav'); nav.scrollLeft = btn.offsetLeft - (nav.offsetWidth / 2) + (btn.offsetWidth / 2);
            document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
        }

        function toggleMobileMenu() { const m = document.getElementById('mobile-menu'); m.classList.toggle('hidden'); m.classList.toggle('flex'); }
        function changeQty(i, d) { cart[i].qty += d; if (cart[i].qty <= 0) cart.splice(i, 1); updateCartUI(); }
        function toggleCart() { document.getElementById('cart-sidebar').classList.toggle('open'); document.getElementById('cart-overlay').classList.toggle('hidden'); }
        function setOrderType(t) {
            orderType = t; const p = document.getElementById('btn-pickup'); const d = document.getElementById('btn-delivery');
            if(t === 'Pickup') { p.className = "py-2 rounded-lg font-bold text-xs bg-red-600 text-white shadow"; d.className = "py-2 rounded-lg font-bold text-xs text-gray-500"; }
            else { d.className = "py-2 rounded-lg font-bold text-xs bg-red-600 text-white shadow"; p.className = "py-2 rounded-lg font-bold text-xs text-gray-500"; }
            document.getElementById('delivery-address-box').classList.toggle('hidden', t === 'Pickup');
        }

        function sendOrder() {
            if (cart.length === 0) return;
            const name = document.getElementById('order-name').value;
            const phone = document.getElementById('order-phone').value;
            const address = document.getElementById('order-address').value;
            if (orderType === 'Delivery' && (!name || !phone || !address)) return alert("Fill delivery details!");
            let total = 0;
            let items = cart.map(i => { total += i.price * i.qty; return `??? *${i.name}* [ID: ${i.id}] (${i.variant}) x${i.qty} = ?${i.price * i.qty}`; }).join('\n');
            let details = orderType === 'Delivery' ? `????????????????????\n?? *Customer:* ${name.toUpperCase()}\n?? *Phone:* ${phone}\n?? *Address:* ${address.toUpperCase()}\n` : '';
            const msg = encodeURIComponent(`?? *NEW ORDER - DEMO 1*\n????????????????????\n?? *Type:* ${orderType.toUpperCase()}\n????????????????????\n${items}\n????????????????????\n?? *BILL: ?${total}*\n${details}\nKindly confirm!`);
            window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;
        }

        function sendContactMessage(e) {
            e.preventDefault();
            const n = document.getElementById('contact-name').value;
            const s = document.getElementById('contact-subject').value;
            const m = document.getElementById('contact-message').value;
            window.location.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(`?? *Web Inquiry*\n\n?? *Client:* ${n}\n?? *Subject:* ${s}\n?? *Message:* ${m}`)}`;
        }

        window.onload = fetchMenu;
    </script>
</body>
</html>
